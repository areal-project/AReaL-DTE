<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" role="img" aria-labelledby="title desc">
  <title id="title">Delta Transfer Engine architecture</title>
  <desc id="desc">A four-stage architecture diagram: training runtime, DTE, transport backend, and rollout runtime.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <linearGradient id="dteFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="540" rx="30" fill="#f8fafc"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="590" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Delta Transfer Engine</text>
    <text x="590" y="74" text-anchor="middle" font-size="15" fill="#475569">Full weights establish the base; later versions move as sparse, shard-aware deltas.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="132" width="210" height="234" rx="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <rect x="320" y="104" width="300" height="290" rx="24" fill="url(#dteFill)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="674" y="132" width="210" height="234" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="938" y="132" width="210" height="234" rx="22" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="161" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">Training runtime</text>
    <text x="161" y="203" text-anchor="middle" font-size="14" fill="#0c4a6e">model weights</text>
    <text x="161" y="228" text-anchor="middle" font-size="14" fill="#0c4a6e">optimizer state</text>
    <text x="161" y="253" text-anchor="middle" font-size="14" fill="#0c4a6e">step version</text>
    <rect x="88" y="294" width="146" height="40" rx="20" fill="#bae6fd"/>
    <text x="161" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#075985">DeltaEngine.push</text>

    <text x="470" y="143" text-anchor="middle" font-size="19" font-weight="800" fill="#4c1d95">DTE</text>
    <text x="470" y="169" text-anchor="middle" font-size="13" fill="#5b21b6">transport-neutral delta semantics</text>
    <rect x="352" y="195" width="236" height="40" rx="14" fill="#ddd6fe"/>
    <text x="470" y="220" text-anchor="middle" font-size="13" font-weight="650" fill="#4c1d95">Detect changed elements</text>
    <rect x="352" y="247" width="236" height="40" rx="14" fill="#e9d5ff"/>
    <text x="470" y="272" text-anchor="middle" font-size="13" font-weight="650" fill="#581c87">Encode sparse / dense payload</text>
    <rect x="352" y="299" width="236" height="40" rx="14" fill="#f3e8ff"/>
    <text x="470" y="324" text-anchor="middle" font-size="13" font-weight="650" fill="#581c87">Remap shard indices + version</text>

    <text x="779" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Transport backend</text>
    <text x="779" y="203" text-anchor="middle" font-size="14" fill="#14532d">Plan / TransferOp</text>
    <text x="779" y="228" text-anchor="middle" font-size="14" fill="#14532d">Payload movement</text>
    <text x="779" y="253" text-anchor="middle" font-size="14" fill="#14532d">NCCL / RDMA / loopback</text>
    <rect x="706" y="294" width="146" height="40" rx="20" fill="#bbf7d0"/>
    <text x="779" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">send / receive</text>

    <text x="1043" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Rollout runtime</text>
    <text x="1043" y="203" text-anchor="middle" font-size="14" fill="#7c2d12">receiver base</text>
    <text x="1043" y="228" text-anchor="middle" font-size="14" fill="#7c2d12">version check</text>
    <text x="1043" y="253" text-anchor="middle" font-size="14" fill="#7c2d12">live inference weights</text>
    <rect x="970" y="294" width="146" height="40" rx="20" fill="#fed7aa"/>
    <text x="1043" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">apply / commit</text>
  </g>

  <g fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)">
    <line x1="266" y1="249" x2="320" y2="249"/>
    <line x1="620" y1="249" x2="674" y2="249"/>
    <line x1="884" y1="249" x2="938" y2="249"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="56" y="420" width="1092" height="76" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="84" y="449" font-size="13" font-weight="700" fill="#0f172a">Normal delta step</text>
    <text x="84" y="476" font-size="13" fill="#475569">detect bitwise changes  →  encode payload  →  remap shard indices  →  transfer bytes  →  validate and apply</text>

    <rect x="820" y="438" width="138" height="32" rx="16" fill="#f1f5f9"/>
    <text x="889" y="459" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">version chained</text>
    <rect x="974" y="438" width="146" height="32" rx="16" fill="#f1f5f9"/>
    <text x="1047" y="459" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">dense fallback</text>
  </g>
</svg>
